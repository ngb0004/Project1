<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#F6F2EA;color:#1D1B18;font-family:"Liberation Serif",Georgia,serif;padding:72px 88px;display:flex;flex-direction:column;justify-content:space-between;border-left:14px solid #B04A2E}
.k{font:600 22px/1 "DejaVu Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6A645A}
h1{font-size:76px;line-height:1.08;font-weight:400;margin-top:22px}
.scale{position:relative;height:84px}
.line{position:absolute;left:0;right:0;top:30px;height:4px;background:#1D1B18}
.dot{position:absolute;top:16px;width:32px;height:32px;border-radius:50%}
.a{left:18%;background:#E5C2B5;border:3px solid #B04A2E}
.b{left:68%;background:#B04A2E}
.arrow{position:absolute;top:24px;left:calc(18% + 44px);width:calc(50% - 56px);height:16px;border-top:3px dashed #B04A2E}
.lab{position:absolute;top:60px;font:600 22px/1 "DejaVu Sans",sans-serif;color:#6A645A}
.l{left:0}.r{right:0}
.foot{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-size:52px;font-weight:700}
.tag{font:24px/1.3 "DejaVu Sans",sans-serif;color:#6A645A}
</style></head><body>
<div><div class="k">Someone shared a dive with you</div>
<h1>Read the facts one at a time.<br>Then see where you land.</h1></div>
<div class="scale"><div class="line"></div><div class="arrow"></div><div class="dot a"></div><div class="dot b"></div><div class="lab l">Disagree</div><div class="lab r">Agree</div></div>
<div class="foot"><div class="brand">Dive</div><div class="tag">Find where you break.</div></div>
</body></html>
